<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>7-Day Diet Plan ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#FAF8F5;--card:#FFFFFF;--plum:#3B0764;--violet:#7C3AED;--lilac:#A78BFA;
  --rose:#F43F5E;--pink:#EC4899;--fuchsia:#C026D3;--emerald:#059669;
  --amber:#D97706;--sky:#0284C7;--text:#1C1B2E;--mid:#4B4563;--light:#9CA3AF;
  --border:#F0EDF9;--shadow:rgba(109,40,217,0.09);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;height:100%}

/* HERO */
.hero{background:linear-gradient(135deg,#3B0764 0%,#6D28D9 45%,#BE185D 100%);padding:26px 20px 22px;color:#fff;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;opacity:.04;background-image:radial-gradient(circle at 25% 35%,#fff 1px,transparent 1px),radial-gradient(circle at 75% 65%,#fff 1px,transparent 1px);background-size:28px 28px}
.hero-eye{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:5px}
.hero-title{font-family:'Playfair Display',serif;font-size:25px;font-weight:700;line-height:1.2;margin-bottom:5px}
.hero-desc{font-size:11.5px;color:rgba(255,255,255,.72);margin-bottom:14px;line-height:1.5}
.hero-badges{display:flex;flex-wrap:wrap;gap:6px}
.hbadge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:100px;padding:4px 11px;font-size:10.5px;font-weight:700;backdrop-filter:blur(6px)}

/* TAB BAR */
.tabs{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #EDE9FE;display:flex;overflow-x:auto;scrollbar-width:none;box-shadow:0 2px 12px rgba(109,40,217,.08)}
.tabs::-webkit-scrollbar{display:none}
.tb{padding:12px 15px;font-size:12.5px;font-family:'Nunito',sans-serif;font-weight:700;color:var(--light);background:none;border:none;border-bottom:2.5px solid transparent;white-space:nowrap;cursor:pointer;transition:all .18s}
.tb.on{color:var(--violet);border-bottom-color:var(--violet)}

/* LAYOUT */
.panels{padding:14px 14px 60px;max-width:480px;margin:0 auto}
.panel{display:none}.panel.on{display:block;animation:fadeUp .22s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.stack>*+*{margin-top:12px}

/* CARDS */
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 14px var(--shadow)}
.ctitle{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--violet);margin-bottom:10px}
.csub{font-size:11px;color:var(--light);margin-top:-6px;margin-bottom:10px;line-height:1.55}
.sechead{font-size:12.5px;font-weight:800;margin:14px 0 8px}

/* TILES */
.t4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.t2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:12px;padding:9px 6px;text-align:center}
.tl{font-size:9px;color:var(--light);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.tv{font-size:13px;font-weight:800;line-height:1.3;margin-top:2px}
.tsub{font-size:10px;color:var(--light);margin-top:2px}
.tile.big .tv{font-size:20px}
.tile.big{padding:12px 10px}
.tv-plum{color:var(--violet)}.tv-fuch{color:var(--fuchsia)}.tv-amb{color:var(--amber)}.tv-sky{color:var(--sky)}.tv-em{color:var(--emerald)}

/* PROGRESS */
.prow{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.plbl{font-size:10px;color:var(--light);font-weight:700;width:38px;flex-shrink:0}
.ptrack{flex:1;height:5px;background:#EDE9FE;border-radius:10px;overflow:hidden}
.pfill{height:100%;border-radius:10px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.pnums{font-size:9px;color:var(--light);white-space:nowrap;width:52px;text-align:right;flex-shrink:0}

/* DAY PICKER */
.daypick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.daypick::-webkit-scrollbar{display:none}
.daybtn{display:flex;flex-direction:column;align-items:center;min-width:50px;border-radius:16px;padding:8px 10px;background:#fff;border:1.5px solid #EDE9FE;cursor:pointer;transition:all .2s;font-family:'Nunito',sans-serif}
.daybtn.on{background:var(--violet);border-color:var(--violet);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.35);transform:translateY(-1px)}
.de{font-size:17px}.ds{font-size:10px;font-weight:800;margin-top:2px}

/* MEAL CARDS */
.mcard{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05);overflow:hidden;margin-bottom:10px}
.mhdr{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;background:none;border:none;width:100%;text-align:left;font-family:'Nunito',sans-serif}
.mtime{background:#EDE9FE;border-radius:10px;padding:5px 7px;min-width:62px;text-align:center}
.mtxt{font-size:10px;font-weight:700;color:var(--violet)}
.minfo{flex:1;min-width:0}
.mtype{font-size:9px;color:var(--light);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.mname{font-size:13px;font-weight:700;color:var(--text);line-height:1.3;margin-top:2px}
.mmacros{text-align:right;flex-shrink:0}
.mkcal{font-size:11px;font-weight:800;color:var(--violet)}
.mprot{font-size:10px;color:var(--fuchsia);font-weight:600}
.mchev{font-size:9px;color:var(--light);margin-top:2px}
.mbody{display:none;padding:12px 15px 14px;background:#F9F7FF;border-top:1px solid #EDE9FE;font-size:12px;color:var(--mid);line-height:1.7}

/* ITEM CARDS */
.ic{border-radius:13px;padding:11px;margin-bottom:7px;border-width:1px;border-style:solid}
.in{font-size:12.5px;font-weight:700;margin-bottom:3px}
.id{font-size:11px;line-height:1.55;color:var(--mid)}
.em{background:#F0FDF4;border-color:#BBF7D0}.em .in{color:#065F46}
.vi{background:#F5F3FF;border-color:#DDD6FE}.vi .in{color:#5B21B6}
.ro{background:#FFF1F2;border-color:#FECDD3}.ro .in{color:#BE123C}
.am{background:#FFFBEB;border-color:#FDE68A}.am .in{color:#92400E}
.sk{background:#F0F9FF;border-color:#BAE6FD}.sk .in{color:#0C4A6E}
.or{background:#FFF7ED;border-color:#FED7AA}.or .in{color:#9A3412}
.pk{background:#FDF2F8;border-color:#FBCFE8}.pk .in{color:#9D174D}
.gy{background:#FAFAFA;border-color:#E5E7EB}.gy .in{color:#1F2937}
.re{background:#FFF1F2;border-color:#FECDD3}

/* SEV */
.sbadge{font-size:9px;font-weight:800;padding:2px 7px;border-radius:100px;letter-spacing:.3px;flex-shrink:0}
.sH{background:#FECDD3;color:#9F1239}.sM{background:#FDE68A;color:#92400E}.sL{background:#BAE6FD;color:#0C4A6E}
.scH{background:#FFF1F2;border-color:#FECDD3}.scM{background:#FFFBEB;border-color:#FDE68A}.scL{background:#F0F9FF;border-color:#BAE6FD}
.sev-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}

/* ROWS & STEPS */
.rrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:#FAFAFA;border-radius:12px;padding:11px;margin-bottom:7px}
.rl{font-size:12.5px;font-weight:600}.rn{font-size:11px;color:var(--light);margin-top:2px}
.rv{font-size:13px;font-weight:800;color:var(--violet);white-space:nowrap}
.step{display:flex;gap:11px;background:#FAFAFA;border-radius:13px;padding:11px;margin-bottom:7px;align-items:flex-start}
.snum{background:var(--violet);color:#fff;border-radius:50%;width:27px;height:27px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.stit{font-size:12.5px;font-weight:700}.sdet{font-size:11px;color:var(--mid);margin-top:3px;line-height:1.55}

/* SNACK ROWS */
.snrow{display:flex;gap:11px;background:#FAFAFA;border-radius:13px;padding:11px;margin-bottom:7px}
.sninfo{flex:1}.snn{font-size:12.5px;font-weight:700}.snd{font-size:11px;color:var(--light);margin-top:2px;line-height:1.45}
.snm{text-align:right;flex-shrink:0;min-width:62px}.snk{font-size:11px;font-weight:800;color:var(--violet)}.snp{font-size:10px;color:var(--fuchsia);font-weight:600}

/* EATING OUT */
.ecard{background:#FAFAFA;border-radius:13px;padding:11px;margin-bottom:7px}
.en{font-size:12.5px;font-weight:700;margin-bottom:3px}.eok{font-size:11px;color:var(--mid);line-height:1.5;margin-bottom:2px}.eav{font-size:11px;color:#E11D48;line-height:1.5}

/* GRAIN */
.gcard{background:#FFFBEB;border:1px solid #FDE68A;border-radius:14px;padding:13px;margin-bottom:9px}
.ghdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.gname{font-size:14px;font-weight:700}
.gstats{display:grid;grid-template-columns:1fr 1fr;gap:3px;font-size:11px;color:var(--light);margin-bottom:5px}
.gnote{font-size:11px;color:var(--mid);line-height:1.55}
.gwhen{font-size:11px;color:var(--violet);font-weight:700;margin-top:6px}

/* GROCERY */
.gcat{font-size:12.5px;font-weight:800;color:var(--text);margin:14px 0 7px}
.gitem{display:flex;gap:7px;font-size:12px;color:var(--mid);margin-bottom:5px;line-height:1.45}
.gdot{color:var(--lilac);flex-shrink:0}

/* SOYA STEPS */
.sstep{display:flex;gap:9px;background:#F0FDF4;border-radius:12px;padding:10px;margin-bottom:7px;align-items:flex-start}
.ssnum{background:#059669;color:#fff;border-radius:50%;width:23px;height:23px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.sstxt{font-size:11px;color:var(--mid);line-height:1.6}

/* SUPP */
.supp{border-radius:13px;padding:11px;margin-bottom:7px}
.supp-am{background:#FFFBEB;border:1px solid #FDE68A}.supp-am .sn{color:var(--amber)}
.supp-ni{background:#EEF2FF;border:1px solid #C7D2FE}.supp-ni .sn{color:#3730A3}
.sn{font-size:12.5px;font-weight:700;margin-bottom:3px}.sd{font-size:11px;color:var(--mid);line-height:1.55}

/* GRADIENT BG CARD */
.gcrd{background:linear-gradient(135deg,#F5F3FF,#FDF2F8);border-radius:18px;padding:16px}
.gcrd .ctitle{color:var(--violet)}
.tm-row{display:flex;gap:8px;margin-bottom:6px;align-items:flex-start}
.tm-lbl{font-size:11px;font-weight:800;flex-shrink:0}

/* POLICY */
.pol-strict{background:#FFF1F2;border:1px solid #FECDD3;border-radius:14px;padding:12px;margin-bottom:8px}
.pol-sust{background:#FFFBEB;border:1px solid #FDE68A;border-radius:14px;padding:12px}
.pol-head{font-size:12.5px;font-weight:800;margin-bottom:6px}
.pol-item{font-size:11.5px;color:var(--mid);margin-bottom:4px}

/* TAG PILL */
.tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px}

/* SAFE AREA */
@supports(padding:env(safe-area-inset-bottom)){.panels{padding-bottom:calc(60px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>

</div>

</div>

  {time:"9:30 AM",type:"Breakfast",name:"Cold Coffee + Sweet Potato + Protein Paneer + Cucumber Salad",desc:"Cold coffee (black or with 50ml low-fat milk — no sugar). 100g boiled sweet potato. 100g Milky Mist Protein Paneer or homemade low-fat paneer — sliced or lightly pan-seared. Simple cucumber salad with lemon & black salt.",kcal:285,pro:22},

  {time:"8:00 PM",type:"Dinner",name:"Rajgira Roti + Gobi Sabzi + Protein Paneer Bhurji",desc:"2 rajgira (amaranth) rotis. Gobi sabzi: 200g cauliflower with cumin, ginger, turmeric & 1 tsp ghee. Protein paneer bhurji: 100g Milky Mist Protein Paneer scrambled with tomato, onion, green chilli, cumin & turmeric.",kcal:480,pro:35}

  {time:"9:30 AM",type:"Breakfast",name:"Besan Chilla with Paneer Stuffing (or Moong Dal Chilla)",desc:"Rotation: 2 chillas made with 50g besan OR 60g soaked yellow moong dal batter. Season with grated ginger, green chilli, cumin, turmeric & ajwain. Stuff with 100g crumbled paneer + coriander + green chilli. Cook on non-stick pan with ½ tsp ghee each side. Green chutney + black coffee or green tea.",kcal:345,pro:28},
  {time:"12:00 PM",type:"Mini Snack",name:"Skyr + Almonds",desc:"150g plain skyr with ½ tsp cinnamon & 8 almonds. Cold, quick, high-protein bridge to lunch.",kcal:160,pro:18},
  {time:"1:30 PM",type:"Lunch",name:"Masoor Dal + Cauliflower Rice + Salad + Curd",desc:"Masoor dal (60g dry) with lauki (200g), ginger, garlic & turmeric. Serve over 200g cauliflower rice (grated cauliflower sautéed in 1 tsp ghee, 3–4 min). Occasionally swap for 30g samak rice or quinoa. Large salad + 150g homemade curd.",kcal:470,pro:28},
  {time:"5:00 PM",type:"Snack",name:"Peanut Makhana Chaat",desc:"20g roasted makhana + 15g roasted peanuts + diced cucumber + cherry tomatoes + chaat masala + lemon + black salt. Light, crunchy — a snack, not a meal.",kcal:135,pro:6},
  {time:"8:00 PM",type:"Dinner",name:"Paneer Bhurji + Sautéed Vegetables + Keto Roti",desc:"175g paneer bhurji: crumbled paneer scrambled with cumin seeds, onion, tomato, capsicum, green chilli, turmeric & coriander in 1 tsp ghee. Sautéed vegetables: 200g mixed broccoli, mushrooms & bell peppers in 1 tsp olive oil + garlic + herbs. 1–2 keto rotis (almond/coconut flour + psyllium husk, ~4g net carbs each). Warm, satisfying.",kcal:475,pro:42}
]},
{id:"wed",short:"WED",emoji:"🫒",title:"Wednesday — Mediterranean Twist",tag:"International",tc:"background:#E0F2FE;color:#0369A1",note:"Egg white breakfast · Anti-inflammatory tofu stir-fry dinner · High omega-3 day",kcal:1550,protein:124,carbs:68,fat:46,fiber:24,meals:[

  {time:"5:00 PM",type:"Snack",name:"Crispy Air-Fried Soya Chunks",desc:"40g dry soya — boiled, squeezed completely dry, coated with psyllium husk + nutritional yeast + chaat masala + chilli (grain-free coating, no flour). Air-fried at 200°C for 15–18 min. See Snacks tab for full recipe.",kcal:155,pro:20},

  {time:"5:00 PM",type:"Snack",name:"Paneer + Corn Salad + Yogurt Dressing",desc:"100g low-fat paneer cubed or crumbled. Optional: 30g sweet corn (occasional — skip on stricter days). Toss with cucumber, cherry tomatoes, red onion & mint. Dressing: 3 tbsp thick curd + lemon + chaat masala + cumin powder + black salt.",kcal:195,pro:18},

function ic(cls,name,desc){return`<div class="ic ${cls}"><div class="in">${name}</div><div class="id">${desc}</div></div>`}
function snack(n,d,k,p,idx){return`<div class="snrow"><div class="sninfo"><div class="snn">${idx+1}. ${n}</div><div class="snd">${d}</div></div><div class="snm"><div class="snk">${k} kcal</div><div class="snp">${p}g prot</div></div></div>`}

function switchDay(i){
  curDay=i;
  document.querySelectorAll('.daybtn').forEach((b,j)=>b.classList.toggle('on',j===i));
  renderDayContent();
}
function toggleMeal(i){
  const body=document.getElementById('mb-'+i);
  const chev=document.getElementById('chev-'+i);
  const isOpen=body.style.display==='block';
  MP[curDay].meals.forEach((_,j)=>{
    const b=document.getElementById('mb-'+j);
    const c=document.getElementById('chev-'+j);
    if(b){b.style.display='none';}
    if(c){c.textContent='▼';}
  });
  if(!isOpen){body.style.display='block';chev.textContent='▲';}
}

/* ─── TAB SWITCHING ─────────────────────────────────────────── */
function switchTab(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
  document.getElementById('panel-'+id).classList.add('on');
  document.querySelector(`[data-tab="${id}"]`).classList.add('on');
  // Scroll tab into view
  const btn=document.querySelector(`[data-tab="${id}"]`);
  btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}
